---
- hosts: all   
  become: true

  vars:
    zabbix_server_ip: "IP"        # NB : Replace the IP with your orchestrator IP address 
    zabbix_agent_hostname: "{{ inventory_hostname }}"

  tasks:
    - name: Ajout de la clé SSH publique pour root
      ansible.posix.authorized_key:
        user: root
        state: present
        key: "{{ lookup('file', '/root/.ssh/id_rsa.pub') }}" # NB : This is the path where the public key is located
        
 # Installation of zabbix-agent2 in both debian and CentOS Linux distribution
    - name: Ajout du repo de Zabbix dans Client 1 (Debian)
      apt:
        deb: "https://repo.zabbix.com/zabbix/6.0/debian/pool/main/z/zabbix-release/zabbix-release_6.0-5+debian12_all.deb"
      register: zabbix_repo
      when: ansible_os_family == "Debian"

    - name: Mise à jour apt (sudo apt update)
      apt:
        update_cache: yes
      when: zabbix_repo is changed and ansible_os_family == "Debian"

    - name: Installation Zabbix Agent2 pour Debian
      apt:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "Debian"

    - name: Ajout le repo Zabbix (RedHat) sans vérification GPG
      command: >
        dnf install -y --nogpgcheck https://repo.zabbix.com/zabbix/6.0/rhel/9/x86_64/zabbix-release-6.0-5.el9.noarch.rpm
      args:
        creates: /etc/yum.repos.d/zabbix.repo
      when: ansible_os_family == "RedHat"
      register: zabbix_repo_rpm

    - name: Mise à jour le cache yum ( sudo yum update (RedHat))
      command: dnf makecache
      when: ansible_os_family == "RedHat"

    - name: Installation de  Zabbix Agent2 (RedHat)
      dnf:
        name: zabbix-agent2
        state: present
      when: ansible_os_family == "RedHat"

    - name: Configuration de Zabbix Agent2
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      with_items:
        - { regexp: '^Server=', line: "Server={{ zabbix_server_ip }}" }
        - { regexp: '^ServerActive=', line: "ServerActive={{ zabbix_server_ip }}" }
        - { regexp: '^Hostname=', line: "Hostname={{ zabbix_agent_hostname }}" }

    - name: Demarrage de Zabbix Agent2  (sudo systemctl enable zabbix-agent2)
      systemd:
        name: zabbix-agent2
        enabled: true
        state: started

    - name: Redémarrage de  Zabbix Agent2 (sudo systemctl restart zabbix-agent2)
      systemd:
        name: zabbix-agent2
        state: restarted
        
  # Creation of dashboards to the clients
    - name: Run create_dashboard.py script from control node
      command: python3 /home/zakariamaarak/myproject/create_dashboard.py
      delegate_to: localhost
